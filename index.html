<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dashboard iPad 4</title>
    <!-- Parser iCal chargé en mode asynchrone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0d111a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            padding: 30px;
            overflow: hidden;
        }

        /* Colonne Gauche (45%) */
        .column-left {
            width: 30%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-right: 30px;
            overflow-y: auto;
        }

        /* Colonne Droite (55%) */
        .column-right {
            width: 70%;
            height: 100%;
            overflow-y: auto;
        }

        /* Horloge & Date */
        .time { font-size: 5rem; font-weight: 300; line-height: 1; }
        .date { font-size: 1.8rem; font-weight: 400; color: #d0d5e0; margin-top: 5px; text-transform: capitalize; }

        /* Météo */
        .weather-main { margin-top: 25px; display: flex; align-items: center; gap: 20px; }
        .temp-now { font-size: 4.5rem; font-weight: 300; }
        .weather-desc { font-size: 1.1rem; color: #a0a5b5; margin-top: 3px; }

        .weather-hourly {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hour-item { text-align: center; color: #a0a5b5; font-size: 0.85rem; }
        .hour-item .hour-icon { width: 30px; height: 30px; margin: 6px auto; }
        .hour-item .hour-temp { color: #ffffff; font-size: 1rem; font-weight: 500; }

        /* Rappels / Notes */
        .reminders { 
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08); 
            padding-top: 15px; 
        }
        
        .note-input-container { display: flex; gap: 10px; margin-bottom: 12px; }
        .note-input {
            flex: 1;
            padding: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .note-btn {
            padding: 0 16px;
            background: #206dbb;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .reminder-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #d0d5e0;
            font-size: 1rem;
        }
        .reminder-circle {
            width: 20px; height: 20px;
            border: 2px solid #606575;
            border-radius: 50%;
            margin-right: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

/* Agenda / Calendrier */
        .day-group { margin-bottom: 22px; }
        .day-header { margin-bottom: 8px; }
        .day-name { font-size: 1.3rem; color: #ffffff; font-weight: 600; text-transform: capitalize; }

        .event-row {
            display: flex;
            margin-bottom: 8px;
            gap: 12px;
            align-items: stretch;
            font-size: 0.95rem;
        }

        .cal-badge {
            width: 140px;
            min-width: 140px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 10px;
            font-weight: 500;
            text-align: center;
            color: #ffffff;
            /* Permet de couper le texte s'il est trop long avec des "..." */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-card {
            flex: 1;
            display: flex;
            border-radius: 6px;
            overflow: hidden;
        }

        .event-time {
            width: 145px;
            min-width: 145px;
            padding: 12px 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        
        .event-title { flex: 1; padding: 12px 15px; display: flex; align-items: center; }

        /* Couleurs dynamiques par Thèmes */
        .theme-blue .cal-badge { background: #206dbb; }
        .theme-blue .event-time { background: #195b9b; }
        .theme-blue .event-title { background: #206dbb; }

        .theme-purple .cal-badge { background: #5b419d; }
        .theme-purple .event-time { background: #4a347f; }
        .theme-purple .event-title { background: #5b419d; }

        .theme-teal .cal-badge { background: #238585; }
        .theme-teal .event-time { background: #1b6b6b; }
        .theme-teal .event-title { background: #238585; }

        .theme-red .cal-badge { background: #b92c1d; }
        .theme-red .event-time { background: #96281b; }
        .theme-red .event-title { background: #b92c1d; }

        .theme-orange .cal-badge { background: #ffd905; }
        .theme-orange .event-time { background: #ffda05c0; }
        .theme-orange .event-title { background: #ffd905; }
    </style>
</head>
<body>

    <!-- COLONNE GAUCHE -->
    <div class="column-left">
        <div>
            <!-- Horloge & Date -->
            <div class="time" id="clock-time">00:00</div>
            <div class="date" id="clock-date">--</div>

            <!-- Météo Principale -->
            <div class="weather-main">
                <div class="temp-now" id="weather-temp">--°</div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <div id="weather-icon-main" style="width:45px; height:45px;"></div>
                    <div>
                        <div class="weather-desc" id="weather-desc">Chargement météo...</div>
                        <div class="weather-desc" id="weather-minmax">↑ --°  ↓ --°</div>
                    </div>
                </div>
            </div>

            <!-- Prévisions Horaires -->
            <div class="weather-hourly" id="weather-hourly"></div>
        </div>

        <!-- Rappels -->
        <div class="reminders">
            <div class="reminders-title" style="font-weight: 600; margin-bottom: 10px;">≡ Rappels / Notes</div>
            
            <form class="note-input-container" onsubmit="addNote(event)">
                <input type="text" id="note-input" class="note-input" placeholder="Ajouter une note..." autocomplete="off">
                <button type="submit" class="note-btn">+</button>
            </form>

            <div id="reminders-list"></div>
        </div>
    </div>

    <!-- COLONNE DROITE (CALENDRIER GOOGLE) -->
    <div class="column-right" id="calendar-container">
        <p style="padding:20px; color:#a0a5b5;">Chargement de l'agenda...</p>
    </div>

    <script>
        // --- 1. HORLOGE ---
        function updateClock() {
            var now = new Date();
            var hours = String(now.getHours()).padStart(2, '0');
            var minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock-time').textContent = hours + ':' + minutes;

            var options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('clock-date').textContent = now.toLocaleDateString('fr-FR', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. METEO ---
        function getWeatherDetails(code, isNight) {
            if (code === 0) {
                if (isNight) {
                    return { 
                        desc: "Nuit claire", 
                        svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>' 
                    };
                }
                return { 
                    desc: "Ensoleillé", 
                    svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>' 
                };
            } else if (code >= 1 && code <= 3) {
                return { desc: "Partiellement nuageux", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>' };
            } else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) {
                return { desc: "Pluvieux", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round"><path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/></svg>' };
            } else {
                return { desc: "Nuageux", svg: '<svg viewBox="0 0 24 24" fill="none" stroke="#bdc3c7" stroke-width="2" stroke-linecap="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>' };
            }
        }

        function fetchWeather() {
            var lat = 43.12, lon = 5.93;
            var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + 
                      '&current_weather=true&hourly=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min&forecast_days=2&timezone=auto';

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var now = new Date();
                    var currentHour = now.getHours();
                    var isNightNow = (currentHour < 6 || currentHour >= 22);

                    var details = getWeatherDetails(data.current_weather.weathercode, isNightNow);
                    document.getElementById('weather-temp').textContent = Math.round(data.current_weather.temperature) + '°';
                    document.getElementById('weather-desc').textContent = details.desc;
                    document.getElementById('weather-icon-main').innerHTML = details.svg;
                    document.getElementById('weather-minmax').textContent = '↑ ' + Math.round(data.daily.temperature_2m_max[0]) + '°  ↓ ' + Math.round(data.daily.temperature_2m_min[0]) + '°';

                    var hourlyContainer = document.getElementById('weather-hourly');
                    hourlyContainer.innerHTML = '';
                    
                    var times = data.hourly.time;
                    var STEP_HOURS = 4;
                    var TOTAL_SLOTS = 5;

                    var startIndex = 0;
                    for (var i = 0; i < times.length; i++) {
                        if (new Date(times[i]).getHours() >= currentHour) { 
                            startIndex = i; 
                            break; 
                        }
                    }

                    for (var slot = 1; slot <= TOTAL_SLOTS; slot++) {
                        var targetIndex = startIndex + (slot * STEP_HOURS);
                        
                        if (targetIndex < times.length) {
                            var hourTime = new Date(times[targetIndex]);
                            var hourVal = hourTime.getHours();
                            var isNightSlot = (hourVal < 6 || hourVal >= 22);
                            
                            var hourDetails = getWeatherDetails(data.hourly.weathercode[targetIndex], isNightSlot);
                            
                            var hourLabel = hourVal + 'h';
                            if (hourTime.getDate() !== now.getDate()) {
                                hourLabel = 'Dem. ' + hourVal + 'h';
                            }

                            var item = document.createElement('div');
                            item.className = 'hour-item';
                            item.innerHTML = '<div style="font-size:0.75rem; white-space:nowrap;">' + hourLabel + '</div>' +
                                             '<div class="hour-icon">' + hourDetails.svg + '</div>' +
                                             '<div class="hour-temp">' + Math.round(data.hourly.temperature_2m[targetIndex]) + '°</div>';
                            
                            hourlyContainer.appendChild(item);
                        }
                    }
                })
                .catch(function(err) { console.error(err); });
        }

        // --- 3. NOTES LOCALES ---
        function getNotes() { return JSON.parse(localStorage.getItem('dakboard_notes') || '["Acheter du lait", "Préparer la réunion"]'); }
        function renderNotes() {
            var notes = getNotes();
            var container = document.getElementById('reminders-list');
            container.innerHTML = '';
            notes.forEach(function(note, index) {
                var item = document.createElement('div');
                item.className = 'reminder-item';
                item.innerHTML = '<span class="reminder-circle" onclick="deleteNote(' + index + ')"></span><span>' + escapeHTML(note) + '</span>';
                container.appendChild(item);
            });
        }
        function addNote(event) {
            event.preventDefault();
            var input = document.getElementById('note-input');
            var text = input.value.trim();
            if (text !== '') {
                var notes = getNotes();
                notes.push(text);
                localStorage.setItem('dakboard_notes', JSON.stringify(notes));
                input.value = '';
                renderNotes();
            }
        }
        function deleteNote(index) {
            var notes = getNotes();
            notes.splice(index, 1);
            localStorage.setItem('dakboard_notes', JSON.stringify(notes));
            renderNotes();
        }
        function escapeHTML(str) {
            return (str || '').replace(/[&<>'"]/g, function(tag) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag; });
        }
        renderNotes();

        // --- 4. CALENDRIER GOOGLE ---
        var GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3iN3pNLvYH1HXfkNM4NewJKi0Hu5qy4YMffgkGQoc2tWMQr3DY_knDPEpQBI29duF1Q/exec';

        var cachedCalendar = localStorage.getItem('cached_ical_data');
        if (cachedCalendar) {
            parseAndRenderCalendar(cachedCalendar);
        }

        function onCalendarLoaded(data) {
            if (data && data.raw) {
                localStorage.setItem('cached_ical_data', data.raw);
                parseAndRenderCalendar(data.raw);
            }
        }

        function fetchGoogleCalendar() {
            if (!GOOGLE_SCRIPT_URL) return;

            var oldScript = document.getElementById('google-jsonp-script');
            if (oldScript && oldScript.parentNode) { oldScript.parentNode.removeChild(oldScript); }

            var script = document.createElement('script');
            script.id = 'google-jsonp-script';
            script.src = GOOGLE_SCRIPT_URL + '?callback=onCalendarLoaded&t=' + new Date().getTime();
            document.body.appendChild(script);
        }

function parseAndRenderCalendar(icsData) {
            try {
                if (typeof ICAL === 'undefined') return;

                var jcalData = ICAL.parse(icsData);
                var comp = new ICAL.Component(jcalData);
                var vevents = comp.getAllSubcomponents('vevent');

                var now = new Date();
                var todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                var events = [];

                vevents.forEach(function(vevent) {
                    var event = new ICAL.Event(vevent);
                    
                    // --- FILTRES DE MASQUAGE ---
                    var calNameProp = vevent.getFirstPropertyValue('x-calendar-name');
                    var calName = calNameProp ? calNameProp : 'Agenda';

                    // 1. On bloque l'agenda des Numéros de semaine
                    if (calName.includes("Numéros de semaine") || (event.summary && event.summary.startsWith('Semaine ') && event.summary.includes(' de '))) {
                        return; 
                    }

                    // 2. Renommer proprement l'agenda des jours fériés
                    if (calName.includes("Jours fériés")) {
                        calName = "FÉRIÉS FÊTES";
                    }

                    var isAllDay = event.startDate.isDate;
                    var startJS, endJS;

                    if (isAllDay) {
                        var s = event.startDate;
                        
                        // ASTUCE CRUCIALE : On fixe l'heure à 12h00 (Midi) au lieu de 00h00.
                        // Cela empêche la date de basculer au jour précédent à cause des fuseaux horaires !
                        startJS = new Date(s.year, s.month - 1, s.day, 12, 0, 0);

                        var e = event.endDate;
                        if (e) {
                            var endDateObj = new Date(e.year, e.month - 1, e.day, 12, 0, 0);
                            // On exclut le jour de fin qui est géré comme "+1 exclusif" par le format iCal
                            if (endDateObj > startJS) {
                                endDateObj.setDate(endDateObj.getDate() - 1);
                            }
                            endJS = endDateObj;
                        } else {
                            endJS = new Date(startJS.getTime());
                        }
                    } else {
                        startJS = event.startDate.toJSDate();
                        endJS = event.endDate ? event.endDate.toJSDate() : new Date(startJS.getTime() + 86400000);
                    }

                    // On extrait les limites "minuit" de début et de fin pour itérer facilement les jours
                    var cur = new Date(startJS.getFullYear(), startJS.getMonth(), startJS.getDate());
                    var end = new Date(endJS.getFullYear(), endJS.getMonth(), endJS.getDate());

                    while (cur <= end) {
                        if (cur >= todayStart) {
                            var eventDate;
                            
                            if (isAllDay) {
                                // On maintient l'événement AllDay au jour exact, à 12h00
                                eventDate = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 12, 0, 0);
                            } else {
                                // On garde l'heure normale pour les autres événements
                                if (cur.getTime() === new Date(startJS.getFullYear(), startJS.getMonth(), startJS.getDate()).getTime()) {
                                    eventDate = new Date(startJS.getTime());
                                } else {
                                    eventDate = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate(), 0, 0, 0);
                                }
                            }

                            events.push({
                                summary: event.summary,
                                startDate: eventDate,
                                isAllDay: isAllDay,
                                calendarName: calName
                            });
                        }
                        cur.setDate(cur.getDate() + 1);
                    }
                });

                events.sort(function(a, b) { return a.startDate - b.startDate; });
                renderCalendarEvents(events);
            } catch (e) {
                console.error("Erreur iCal:", e);
            }
        }

        // Système d'attribution de couleurs fixes
        var assignedThemes = {
            "KEVIN": "theme-blue",       // L'agenda KEVIN sera en bleu
            "ESTELLE": "theme-purple",   // L'agenda ESTELLE sera en violet
            "FAMILLE": "theme-teal",     // L'agenda FAMILLE sera en vert/turquoise
            "Anniversaires": "theme-orange", // L'agenda Anniversaires sera en orange
            "FÉRIÉS FÊTES": "theme-red"
        };
        var availableThemes = ['theme-blue', 'theme-purple', 'theme-teal', 'theme-red', 'theme-orange'];
        var nextThemeIndex = 0;

        function getThemeForCalendar(name) {
            if (!assignedThemes[name]) {
                // Associe une nouvelle couleur à un nouvel agenda
                assignedThemes[name] = availableThemes[nextThemeIndex % availableThemes.length];
                nextThemeIndex++;
            }
            return assignedThemes[name];
        }

        function renderCalendarEvents(events) {
            var container = document.getElementById('calendar-container');
            container.innerHTML = '';

            if (events.length === 0) {
                container.innerHTML = '<p style="padding:20px; color:#a0a5b5;">Aucun événement à venir.</p>';
                return;
            }

            var grouped = {};
            events.forEach(function(ev) {
                var dateKey = ev.startDate.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', weekday: 'long' });
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(ev);
            });

            for (var dateTitle in grouped) {
                var dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';

                var dayHeader = '<div class="day-header"><span class="day-name">' + dateTitle + '</span></div>';
                var eventsHTML = '';

                grouped[dateTitle].forEach(function(ev) {
                    // On attribue le thème en fonction du nom du calendrier
                    var themeClass = getThemeForCalendar(ev.calendarName);
                    var timeStr = 'Toute la journée';

                    if (!ev.isAllDay) {
                        var h = String(ev.startDate.getHours()).padStart(2, '0');
                        var m = String(ev.startDate.getMinutes()).padStart(2, '0');
                        timeStr = h + ':' + m;
                    }

                    // Structure HTML avec le badge à gauche
                    eventsHTML += '<div class="event-row ' + themeClass + '">' +
                        '<div class="cal-badge">' + escapeHTML(ev.calendarName) + '</div>' +
                        '<div class="event-card">' +
                            '<div class="event-time">' + timeStr + '</div>' +
                            '<div class="event-title">' + escapeHTML(ev.summary) + '</div>' +
                        '</div>' +
                    '</div>';
                });

                dayGroup.innerHTML = dayHeader + eventsHTML;
                container.appendChild(dayGroup);
            }
        }

        // --- 5. INITIALISATION ET GESTION DES RAFRAÎCHISSEMENTS ---
        fetchWeather();
        fetchGoogleCalendar();

        var isTyping = false;
        var initialLoadTime = Date.now(); // Date de démarrage pour éviter la boucle immédiate

        var noteInputEl = document.getElementById('note-input');
        if (noteInputEl) {
            noteInputEl.addEventListener('focus', function() { isTyping = true; });
            noteInputEl.addEventListener('blur', function() { isTyping = false; });
        }

        // Rechargement automatique de secours toutes les 15 minutes
        setInterval(function() {
            if (!isTyping) {
                location.reload();
            }
        }, 15 * 60 * 1000);

        function refreshDashboardOnWake() {
            // Ignorer si l'utilisateur tape une note OU si la page vient de charger il y a moins de 10 secondes
            if (isTyping || (Date.now() - initialLoadTime < 10000)) return;

            updateClock();
            location.reload();
        }

        window.addEventListener('pageshow', refreshDashboardOnWake);
        window.addEventListener('focus', refreshDashboardOnWake);
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) refreshDashboardOnWake();
        });
    </script>
</body>
</html>
